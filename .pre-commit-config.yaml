files: ".*py"
repos:
  - repo: https://github.com/PyCQA/modernize
    rev: v0.9rc0
    hooks:
      - id: modernize
        args:
          - --nofix
          # Ignore fix_long because it doesn't support usage of past.long as futurize does
          - fissix.fixes.fix_long
  - repo: https://github.com/PythonCharmers/python-future
    rev: 80523f383fbba1c6de0551e19d0277e73e69573c
    hooks:
      - id: futurize